<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Pablo Odriozola — Pintura al óleo / Oil Painting</title>
  <meta name="description" content="Obra original al óleo de Pablo Odriozola. Original oil paintings by Pablo Odriozola." />

  <!-- Open Graph / social sharing defaults (home page). Painting pages get their own later. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pablo Odriozola — Pintura al óleo / Oil Painting" />
  <meta property="og:description" content="Obra original al óleo. Original oil paintings." />
  <meta property="og:image" content="/og-default.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fonts: Cormorant Garamond (headings), Schibsted Grotesk (UI/body/prices), Parisienne (painting titles) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Parisienne&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Skip link for keyboard users -->
  <a class="skip-link" href="#gallery" data-i18n="skip_to_gallery">Saltar a la galería</a>

  <!-- ===================== HEADER / NAV ===================== -->
  <header class="site-header" id="site-header">
    <nav class="nav" aria-label="Principal">
      <!-- Left: section links -->
      <ul class="nav__links" id="nav-links">
        <li><a href="shop.html" data-i18n="nav_shop">Tienda de arte</a></li>
        <li><a href="about.html" data-i18n="nav_about">Sobre</a></li>
        <li><a href="exhibitions.html" data-i18n="nav_exhibitions">Exposiciones</a></li>
        <li><a href="contact.html" data-i18n="nav_contact">Contacto</a></li>
      </ul>

      <!-- Center: wordmark -->
      <a class="nav__brand" href="/">
        <span class="nav__name">Pablo Odriozola</span>
      </a>

      <!-- Right: language toggle + mobile menu button -->
      <div class="nav__right">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-toggle__btn" data-lang="es">ES</button>
          <span class="lang-toggle__sep" aria-hidden="true">·</span>
          <button type="button" class="lang-toggle__btn" data-lang="en">EN</button>
        </div>
        <button type="button" class="nav__menu-toggle" id="menu-toggle"
                aria-expanded="false" aria-controls="nav-links" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <!-- ===================== HERO ===================== -->
    <!-- One full-bleed painting. main.js sets the image + a subtle zoom-parallax on desktop. -->
    <section class="hero" id="hero" aria-label="Pablo Odriozola">
      <div class="hero__media" id="hero-media"></div>
    </section>

    <!-- ===================== GALLERY ===================== -->
    <section class="gallery" id="gallery">
      <div class="gallery__intro">
        <h1 class="gallery__title" data-i18n="gallery_title">La obra</h1>
        <p class="gallery__statement" data-i18n="gallery_statement">
          Óleo sobre tela. Cada pieza es única.
        </p>
      </div>

      <!-- A featured selection is rendered here by main.js -->
      <div class="gallery__grid" id="gallery-grid" aria-live="polite" aria-busy="true"></div>

      <!-- Empty / error states (toggled by main.js) -->
      <p class="gallery__empty" id="gallery-empty" hidden data-i18n="gallery_empty">
        Pronto habrá obra disponible.
      </p>

      <!-- Link through to the full shop -->
      <div class="gallery__cta">
        <a class="btn-outline" href="shop.html" data-i18n="view_shop">Ver la tienda de arte</a>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <a class="site-footer__brand" href="/">PABLO ODRIOZOLA</a>
      <nav class="site-footer__nav" aria-label="Pie de página">
        <a href="shop.html" data-i18n="nav_shop">Tienda de arte</a>
        <a href="about.html" data-i18n="nav_about">Sobre</a>
        <a href="exhibitions.html" data-i18n="nav_exhibitions">Exposiciones</a>
        <a href="contact.html" data-i18n="nav_contact">Contacto</a>
        <a href="privacy.html" data-i18n="nav_privacy">Privacidad</a>
        <a href="terms.html" data-i18n="nav_terms">Términos</a>
      </nav>
      <a class="site-footer__ig" href="https://www.instagram.com/arteodriozola" target="_blank" rel="noopener" aria-label="Instagram">
        <!-- Instagram glyph (inline SVG, no emoji) -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <p class="site-footer__copy">© <span id="year"></span> Pablo Odriozola</p>
    </div>
  </footer>

  <!-- ===================== LIGHTBOX ===================== -->
  <!-- Painting expands into here on click (View Transitions API, with a FLIP fallback). -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox__backdrop" id="lightbox-backdrop"></div>
    <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
    <figure class="lightbox__figure" id="lightbox-figure">
      <img class="lightbox__img" id="lightbox-img" alt="" />
      <figcaption class="lightbox__caption" id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
