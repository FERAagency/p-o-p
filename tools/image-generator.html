<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Generator · Pablo Odriozola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Schibsted+Grotesk:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #faf9f6;
      --text: #1a1a1a;
      --accent: #c4622d;
      --muted: #888;
      --border: #e3e0d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 0.25rem;
    }

    .subtitle { color: var(--muted); margin: 0 0 2.5rem; }

    form { display: flex; flex-direction: column; gap: 1rem; }

    label { font-weight: 500; font-size: 0.95rem; }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 0.9rem 1rem;
      font: inherit;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    button {
      align-self: flex-start;
      padding: 0.75rem 1.6rem;
      font: inherit;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: progress; }

    #status { min-height: 1.4em; margin-top: 1.25rem; color: var(--muted); }

    #result { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }

    #result img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
    }

    .download-link {
      align-self: flex-start;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
    }

    .download-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>AI Image Generator</h1>
    <p class="subtitle">Text&nbsp;→&nbsp;image, powered by FLUX.1-schnell on Hugging Face.</p>

    <form id="gen-form">
      <label for="prompt">Describe the image</label>
      <textarea
        id="prompt"
        name="prompt"
        placeholder="e.g. a warm terracotta still life of oranges on linen, soft natural light, oil painting style"
        required
      ></textarea>
      <button type="submit" id="generate-btn">Generate</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="result"></div>
  </main>

  <script src="../js/ai-tools.js"></script>
</body>
</html>
